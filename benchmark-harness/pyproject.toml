[project]
name = "benchmark-harness"
version = "0.1.0.dev0"
description = "Reusable benchmarking harness for storage workloads (fio, MLPerf Storage) on multi-node clusters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kumar Nachiketa" }]
keywords = ["benchmarking", "storage", "fio", "mlperf", "nvme"]

dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
